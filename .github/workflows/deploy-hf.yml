# Uploads main to the Hugging Face Space named in the repo variable HF_SPACE (e.g. "noah/glucosnap"),
# which builds the Dockerfile and serves the app. Needs the repo secret HF_TOKEN (a write token).
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.25"
      - name: Prepare the Space files
        # Spaces read their settings from YAML at the top of README.md; the GitHub README stays clean.
        run: |
          mkdir /tmp/space
          git archive HEAD | tar -x -C /tmp/space
          rm -rf /tmp/space/.github
          { printf -- '---\ntitle: GlucoSnap\nemoji: 🍝\ncolorFrom: green\ncolorTo: blue\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'; cat README.md; } > /tmp/space/README.md
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"], repo_type="space", folder_path="/tmp/space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
          )
          PY
