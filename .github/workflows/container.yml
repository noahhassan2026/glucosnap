# Builds the app container. On main it is pushed to GitHub Container Registry
# (ghcr.io/noahhassan2026/glucosnap) for Azure Container Apps to pull; on pull
# requests it is only built and smoke-tested, as a check that the Dockerfile works.
name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name app -p 7860:7860 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 2; done
          curl -sf localhost:7860/api/health
          curl -sf localhost:7860/ | grep -q '<div id="root">'
          curl -sf -X POST localhost:7860/api/predict \
            -F 'context={"meal_type":"lunch","hour":12,"macros":{"carbs":60,"protein":20,"fat":15,"fiber":5}}' | grep -q peak_delta_mg_dl
          TOKEN=$(curl -sf -X POST localhost:7860/api/auth/signup -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","password":"ci-pass-1"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sf -X PUT localhost:7860/api/me/data -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"data":{"glucosnap-quest":{"level":3,"streak":2}}}'
          curl -sf localhost:7860/api/leaderboard | grep -q ci_user
      - name: Container logs
        if: failure() && github.event_name == 'pull_request'
        run: docker logs app || true
